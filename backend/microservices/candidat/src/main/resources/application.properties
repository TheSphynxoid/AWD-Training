spring.application.name=candidat
server.port=8081

# PostgreSQL
spring.datasource.url=${CANDIDAT_DATABASE_URL:jdbc:postgresql://localhost:5432/candidat_db}
spring.datasource.username=${CANDIDAT_DATABASE_USERNAME:postgres}
spring.datasource.password=${CANDIDAT_DATABASE_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate creates and updates the service schema.
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

#Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

eureka.client.register-with-eureka=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/